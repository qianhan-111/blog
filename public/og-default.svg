<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Blog Platform</title>
  <desc id="desc">公开博客、作者工作区与管理员后台的一体化前端应用默认分享图。</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101828" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="36" />
  <g fill="#f8fafc">
    <text x="96" y="240" font-size="76" font-family="Arial, sans-serif" font-weight="700">Blog Platform</text>
    <text x="96" y="324" font-size="34" font-family="Arial, sans-serif" opacity="0.88">
      Public blog, author workspace, and admin console in one frontend.
    </text>
    <rect x="96" y="392" width="240" height="70" rx="35" fill="#f8fafc" opacity="0.12" />
    <text x="136" y="438" font-size="28" font-family="Arial, sans-serif">Vue 3 + Vite</text>
  </g>
</svg>
